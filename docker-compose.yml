name: sips-reviewer-env

services:
  postgresql:
    image: postgres:16-alpine
    container_name: sips-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-SIPS.Connect.DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sips_pg_data:/var/lib/postgresql/data
    networks:
      - sips-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  sips-connect:
    build:
      context: .
      dockerfile: SIPS.Connect/Dockerfile
    container_name: sips-connect
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - ConnectionStrings__db=Host=postgresql;Database=${DB_NAME:-SIPS.Connect.DB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres};Include Error Detail=True;
      - Xades__BIC=${BANK_CODE:-ZKBASOS0}
      - Xades__WithoutPKI=${WITHOUT_PKI:-true}
      # PAPSS-facing integration (disabled by default)
      - PapssFacing__Enabled=${PAPSS_ENABLED:-false}
      - PapssFacing__IsoIngressUrl=${PAPSS_ISO_INGRESS_URL:-}
      - PapssFacing__AllowedHosts__0=${PAPSS_ALLOWED_HOST:-}
      - PapssFacing__Environment=${PAPSS_ENVIRONMENT:-}
      - PapssFacing__RemoteWpSipsIdentity=${PAPSS_REMOTE_IDENTITY:-}
      - PapssFacing__SecurityProfile=${PAPSS_SECURITY_PROFILE:-}
      - PapssFacing__RequestTimeoutSeconds=${PAPSS_REQUEST_TIMEOUT_SECONDS:-30}
      - PapssFacing__MaximumResponseBytes=${PAPSS_MAXIMUM_RESPONSE_BYTES:-2000000}
      - PapssFacing__ReadinessStaleSeconds=${PAPSS_READINESS_STALE_SECONDS:-300}
      - PapssFacing__SpsPolicy__AllowedLocalInstruments__0=${PAPSS_SPS_POLICY_LOCAL_INSTRUMENT:-}
      - PapssFacing__LocalCountry=${PAPSS_LOCAL_COUNTRY:-}
      - PapssFacing__SendingCurrencies__0=${PAPSS_SENDING_CURRENCY:-}
      - PapssFacing__CallbackMappingProfile=${PAPSS_CALLBACK_MAPPING_PROFILE:-}
      - PapssFacing__CallbackUrl=${PAPSS_CALLBACK_URL:-}
      - ISO20022__SIPS=${SIPS_SWITCH_URL:?SIPS_SWITCH_URL is required}
      - ISO20022__Agent=${BANK_CODE:-ZKBASOS0}
      - ISO20022__BIC=${BANK_CODE:-ZKBASOS0}
      - Emv__AcquirerId=${ACQUIRER_ID:-0000}
      - Emv__FIType=${FI_TYPE:-01}
      - Emv__FIName=${FI_NAME:-Reviewer Bank}
      - ISO20022__Verification=${ISO20022_VERIFICATION_URL:-http://sips-corebank:8080/api/cb/verify}
      - ISO20022__PayerBankCode=${PAYER_BANK_CODE:-}
      - ISO20022__PayerChannel=${PAYER_CHANNEL:-}
      # PKI Discovery Settings (Optional / PKI-On mode only)
      - Core__BaseUrl=${SIPS_CORE_BASE_URL:-}
      - Core__PublicKeysRepUrl=${SIPS_CORE_PUBLIC_KEYS_REP_URL:-}
      - Core__LoginEndpoint=${SIPS_CORE_LOGIN_ENDPOINT:-}
      - Core__LiveParticipantsEndpoint=${SIPS_CORE_LIVE_PARTICIPANTS_ENDPOINT:-}
      - Core__BalanceStatusEndpoint=${SIPS_CORE_BALANCE_STATUS_ENDPOINT:-}
      - Core__Username=${SIPS_CORE_USERNAME:-}
      - Core__Password=${SIPS_CORE_PASSWORD:-}
      - Core__CallbackAuthEnabled=${CALLBACK_AUTH_ENABLED:-false}
      - Core__CallbackTokenEndpoint=${CALLBACK_TOKEN_ENDPOINT:-}
      - Core__CallbackClientId=${CALLBACK_CLIENT_ID:-}
      - Core__CallbackClientSecret=${CALLBACK_CLIENT_SECRET:-}
      - Core__CallbackScope=${CALLBACK_SCOPE:-}
      - Core__CallbackAudience=${CALLBACK_AUDIENCE:-}
      - ISO20022__Transfer=${ISO20022_TRANSFER_URL:-http://sips-corebank:8080/api/CB/Transfer}
      - ISO20022__Return=${ISO20022_RETURN_URL:-http://sips-corebank:8080/api/CB/Return}
      - ISO20022__Status=${ISO20022_STATUS_URL:-http://sips-corebank:8080/api/CB/Status}
      - ISO20022__CompletionNotification=${ISO20022_COMPLETION_NOTIFICATION_URL:-http://sips-corebank:8080/api/CB/CompletionNotification}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "${SIPS_CONNECT_PORT:-8080}:8080"
      - "${SIPS_CONNECT_HTTPS_PORT:-9443}:443"
    volumes:
      - ./logs:/app/logs:rw
      - ./certs:/app/certs:ro
      - ./keys:/app/keys:rw
      - ./jsonAdapter.json:/app/jsonAdapter.json:ro
    networks:
      - sips-network

  sips-corebank:
    image: hanad/sips-consumer:1.1.3
    container_name: sips-corebank
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "${SIPS_COREBANK_PORT:-8081}:8080"
    env_file:
      - ./.env
    volumes:
      - ./mock-corebank.json:/app/db.json:rw
      - ./certs:/certs:ro
    networks:
      - sips-network

networks:
  sips-network:
    driver: bridge

volumes:
  sips_pg_data:
