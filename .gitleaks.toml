title = "SIPS secret scanning"
[extend]
useDefault = true

# XML KeyInfo identifiers name public signature nodes, not private/API keys.
# Match only these UUID-shaped identifiers in the specific captured/test XML files.
[[allowlists]]
description = "Public XML signature reference IDs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^((?:Packages/)?SIPS.Core.Tests/TestData/(acmt\.023|pacs\.004|pacs\.008)\.xml|(?:SIPS.Connect/)?TestScripts/Payloads/(acmt\.023|pacs\.008)\.xml|SIPS.Connect.Tests/Fixtures/recall-outcome-unresolved-callback-20260926\.xml)$''']
regexTarget = "match"
regexes = ['''^KeyInfo Id="[A-Za-z0-9_:-]+"$''']

[[allowlists]]
description = "Illustrative Data Protection key identifier (not key material)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(?:SIPS.Connect/)?DATA_PROTECTION_KEY_SECURITY\.md$''']
regexTarget = "match"
regexes = ['''^key id="[0-9a-fA-F-]{36}"$''']
