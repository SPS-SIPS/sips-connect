name: sips-b

services:
  sips-postgresql-b:
    image: postgres:16-alpine
    container_name: sips-postgresql-b
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-SIPS.Connect.DB.B}
    ports:
      - "${SIPS_POSTGRES_PORT:-6432}:5432"
    volumes:
      - sips_pg_data_b:/var/lib/postgresql/data
    networks:
      - sips-network-b
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  sips-connect-b:
    build:
      context: .
      dockerfile: SIPS.Connect/Dockerfile
    container_name: sips-connect-b
    restart: unless-stopped
    depends_on:
      sips-postgresql-b:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ConnectionStrings__db=Host=sips-postgresql-b;Database=${DB_NAME:-SIPS.Connect.DB.B};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres};Include Error Detail=True;
      - Xades__BIC=${BANK_CODE:-BKBASOS0}
      - Xades__WithoutPKI=${WITHOUT_PKI:-true}
      # PAPSS-facing integration (disabled by default)
      - PapssFacing__Enabled=${PAPSS_ENABLED:-false}
      - PapssFacing__IsoIngressUrl=${PAPSS_ISO_INGRESS_URL:-}
      - PapssFacing__AllowedHosts__0=${PAPSS_ALLOWED_HOST:-}
      - PapssFacing__Environment=${PAPSS_ENVIRONMENT:-}
      - PapssFacing__RemoteWpSipsIdentity=${PAPSS_REMOTE_IDENTITY:-}
      - PapssFacing__ResponderTrust__CertificateSha256=${PAPSS_RESPONDER_CERTIFICATE_SHA256:-}
      - PapssFacing__ResponderTrust__Authority=${PAPSS_RESPONDER_AUTHORITY:-}
      - PapssFacing__ResponderTrust__TrustProfileVersion=${PAPSS_RESPONDER_TRUST_PROFILE_VERSION:-}
      - PapssFacing__ResponderTrust__RequiredExtendedKeyUsageOid=${PAPSS_RESPONDER_REQUIRED_EKU_OID:-}
      - PapssFacing__SecurityProfile=${PAPSS_SECURITY_PROFILE:-}
      - PapssFacing__RequestTimeoutSeconds=${PAPSS_REQUEST_TIMEOUT_SECONDS:-30}
      - PapssFacing__MaximumResponseBytes=${PAPSS_MAXIMUM_RESPONSE_BYTES:-2000000}
      - PapssFacing__ReadinessStaleSeconds=${PAPSS_READINESS_STALE_SECONDS:-300}
      - PapssFacing__SpsPolicy__AllowedLocalInstruments__0=${PAPSS_SPS_POLICY_LOCAL_INSTRUMENT:-}
      - PapssFacing__LocalCountry=${PAPSS_LOCAL_COUNTRY:-}
      - PapssFacing__SendingCurrencies__0=${PAPSS_SENDING_CURRENCY:-}
      - PapssFacing__CallbackMappingProfile=${PAPSS_CALLBACK_MAPPING_PROFILE:-}
      - PapssFacing__CallbackUrl=${PAPSS_CALLBACK_URL:-}
      # PAPSS operation store (all optional; unset = behaviour unchanged). See docs/PAPSS_OPERATION_STORE_CONFIG.md
      - PapssFacing__Inbound__Acmt023__ResponseDeadlineSeconds=${PAPSS_ACMT023_RESPONSE_DEADLINE_SECONDS:-}
      - PapssFacing__Inbound__Acmt023__DeadlineClock=${PAPSS_ACMT023_DEADLINE_CLOCK:-}
      - PapssFacing__Inbound__LateResponsePolicy=${PAPSS_LATE_RESPONSE_POLICY:-Submit}
      - PapssFacing__Outbound__VerificationResultExpirySeconds=${PAPSS_VERIFICATION_RESULT_EXPIRY_SECONDS:-}
      - PapssFacing__Store__RetentionDays=${PAPSS_STORE_RETENTION_DAYS:-}
      - PapssFacing__Store__PurgeIntervalMinutes=${PAPSS_STORE_PURGE_INTERVAL_MINUTES:-60}
      - PapssFacing__Delivery__MaxAttempts=${PAPSS_DELIVERY_MAX_ATTEMPTS:-10}
      - PapssFacing__Delivery__InitialBackoffSeconds=${PAPSS_DELIVERY_INITIAL_BACKOFF_SECONDS:-5}
      - PapssFacing__Delivery__MaxBackoffSeconds=${PAPSS_DELIVERY_MAX_BACKOFF_SECONDS:-300}
      - PapssFacing__Delivery__PollIntervalSeconds=${PAPSS_DELIVERY_POLL_INTERVAL_SECONDS:-5}
      - PapssFacing__Delivery__ClaimLeaseSeconds=${PAPSS_DELIVERY_CLAIM_LEASE_SECONDS:-120}
      - PapssFacing__Lookup__MaxWaitSeconds=${PAPSS_LOOKUP_MAX_WAIT_SECONDS:-0}
      - ISO20022__SIPS=${SIPS_PEER_URL:?SIPS_PEER_URL is required}
      - ISO20022__Agent=${BANK_CODE:?BANK_CODE is required}
      - ISO20022__BIC=${BANK_CODE:?BANK_CODE is required}
      - Emv__AcquirerId=${ACQUIRER_ID:?ACQUIRER_ID is required}
      - Emv__FIType=${FI_TYPE:?FI_TYPE is required}
      - Emv__FIName=${FI_NAME:?FI_NAME is required}
      - ISO20022__Verification=${ISO20022_VERIFICATION_URL:?ISO20022_VERIFICATION_URL is required}
      - ISO20022__PayerBankCode=${PAYER_BANK_CODE:-}
      - ISO20022__PayerChannel=${PAYER_CHANNEL:-}
      - ISO20022__Transfer=${ISO20022_TRANSFER_URL:?ISO20022_TRANSFER_URL is required}
      - ISO20022__Return=${ISO20022_RETURN_URL:?ISO20022_RETURN_URL is required}
      - ISO20022__Status=${ISO20022_STATUS_URL:?ISO20022_STATUS_URL is required}
      - ISO20022__CompletionNotification=${ISO20022_COMPLETION_NOTIFICATION_URL:?ISO20022_COMPLETION_NOTIFICATION_URL is required}
      - ISO20022__Key=${Test_CoreBank_API_Key:-123}
      - ISO20022__Secret=${Test_CoreBank_API_Secret:-123}
      - Core__CallbackAuthEnabled=${CALLBACK_AUTH_ENABLED:-false}
      - Core__CallbackTokenEndpoint=${CALLBACK_TOKEN_ENDPOINT:-}
      - Core__CallbackClientId=${CALLBACK_CLIENT_ID:-}
      - Core__CallbackClientSecret=${CALLBACK_CLIENT_SECRET:-}
      - Core__CallbackScope=${CALLBACK_SCOPE:-}
      - Core__CallbackAudience=${CALLBACK_AUDIENCE:-}
      - Core__IncludeCoreBankOnListing=${Core_IncludeCoreBankOnListing:-true}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "9080:8080"
      - "10443:443"
    volumes:
      - ./logs/node-b:/app/logs:rw
      - ./certs:/app/certs:ro
      - ./keys/node-b:/app/keys:rw
      - ./jsonAdapter.node-b.json:/app/jsonAdapter.json:ro
    networks:
      - sips-network-b

  sips-corebank-b:
    image: hanad/sips-consumer:1.1.3
    container_name: sips-corebank-b
    restart: unless-stopped
    depends_on:
      sips-postgresql-b:
        condition: service_healthy
    ports:
      - "${SIPS_COREBANK_PORT:-9081}:8080"
    environment:
      - COREBANK_PORT=8080
      - SIPS__ApiKey=${Test_CoreBank_API_Key:-123}
      - SIPS__ApiSecret=${Test_CoreBank_API_Secret:-123}
    volumes:
      - ./mock-corebank.json:/app/db.json:rw
      - ./certs:/certs:ro
    networks:
      - sips-network-b

networks:
  sips-network-b:
    driver: bridge

volumes:
  sips_pg_data_b:
