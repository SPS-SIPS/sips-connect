name: Build and publish SPS Connect

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH); first GHCR release is 2.0.0'
        required: true
        default: '2.0.0'
        type: string

permissions:
  contents: read

# Serialize publishing so edge/latest cannot race between builds.
concurrency:
  group: container-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image name and version
        id: image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/container-tags.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prevent replacement of an existing release
        if: github.event_name != 'pull_request' && steps.image.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          namespace="orgs"
          if [[ "$OWNER_TYPE" == "User" ]]; then namespace="users"; fi
          tags_file="$(mktemp)"
          error_file="$(mktemp)"
          if gh api --paginate "/$namespace/$OWNER/packages/container/sps-connect/versions?per_page=100" \
            --jq '.[].metadata.container.tags[]' > "$tags_file" 2> "$error_file"; then
            if grep -Fxq "$VERSION" "$tags_file"; then
              echo "::error::Release $VERSION already exists. Choose a new version."
              exit 1
            fi
          elif ! grep -q '(HTTP 404)' "$error_file"; then
            # A missing package is expected on the first publication. Other API
            # failures must not be treated as proof that a version is unused.
            cat "$error_file" >&2
            exit 1
          fi

      - name: Build both architectures and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SIPS.Connect/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=SPS Connect
            org.opencontainers.image.description=Domestic SIPS and cross-border PAPSS technical connector
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true

      - name: Record published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAGS: ${{ steps.image.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Published SPS Connect image'
            echo '```text'
            printf '%s\n' "$TAGS"
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
